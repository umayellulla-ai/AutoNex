services:
  - type: web
    name: autonex
    runtime: python
    rootDir: AUTONEX
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: USE_SQLITE_FALLBACK
        value: "1"
